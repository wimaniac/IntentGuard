project:
  seed: 42
  data_dir: data
  artifact_dir: data/artifacts
  report_dir: reports

data:
  banking_dataset:
    name: GreenNode/banking77-vn
    config: null
    text_column: text
    label_column: label
    label_text_column: label_text
    train_split: train
    test_split: test
  split:
    train_fraction: 0.70
    model_selection_fraction: 0.10
    calibration_fraction: 0.10
    threshold_fraction: 0.10
  ood:
    massive:
      name: AmazonScience/massive
      config: vi-VN
      revision: refs/convert/parquet
      schema_file: massive.py
      schema_revision: main
      splits: [validation, test]
      text_column: utt
      topic_column: scenario
      topics: [alarm, weather, music, calendar, iot]
    faq_quality_file: data/faq_ood_quality_status.json

models:
  baseline:
    grid:
      word_ngram_range: [[1, 2], [1, 3]]
      char_ngram_range: [[3, 5], [3, 6]]
      min_df: [1, 2]
      c: [1.0, 3.0]
      max_features: [150000]
      class_weight: [null]
  deep:
    name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    max_length: 128
    batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 0.00002
    weight_decay: 0.01
    max_epochs: 6
    patience: 2
    use_mixed_precision: true
    num_workers: 0

calibration:
  max_rejection_rate: 0.05
  ece_bins: 15

inference:
  top_k: 3
  similar_k: 3
  backend: baseline
